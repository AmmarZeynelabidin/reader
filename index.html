<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>قارئي</title>
<style>
:root{--bg:#eef1f3;--fg:#14202b;--mut:#66727d;--ac:#0f766e;--bar:#fff;--ln:#d5dbe0;--pg:#fff}
body[data-t=dark]{--bg:#0f1418;--fg:#dfe6ea;--mut:#8a97a0;--ac:#2dd4bf;--bar:#171e24;--ln:#26303a;--pg:#000}
body[data-t=sepia]{--bg:#e9dfc8;--fg:#3b2f1e;--mut:#7d6c52;--ac:#9a5b13;--bar:#f3ead3;--ln:#d3c5a5;--pg:#f4ecd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Naskh Arabic","Droid Arabic Naskh",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:10px 12px;cursor:pointer}
[hidden]{display:none!important}
#lib{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#lib header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--ln)}
#lib h1{margin:0;font-size:22px}
.add{background:var(--ac);color:#fff;border-radius:8px;font-weight:700}
body[data-t=dark] .add{color:#04201c}
#grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:18px 12px;padding:16px;align-content:start}
.bk{position:relative;text-align:start;padding:0}
.bk img,.bk .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--ln);border-radius:4px;background:var(--pg);display:block}
.bk b{display:block;font-size:13px;margin-top:6px;line-height:1.4;max-height:2.8em;overflow:hidden}
.bar{height:3px;background:var(--ln);margin-top:5px}.bar i{display:block;height:100%;background:var(--ac)}
.bk small{color:var(--mut);font-size:11px}
.x{position:absolute;top:4px;inset-inline-start:4px;background:#000a;color:#fff;border-radius:50%;width:26px;height:26px;padding:0;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);margin-top:25vh;line-height:2}
#rd{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
.top,.bot{position:absolute;inset-inline:0;background:var(--bar);border-color:var(--ln);z-index:5;display:flex;align-items:center;transition:transform .2s}
.top{top:0;border-bottom:1px solid;padding-top:env(safe-area-inset-top)}
.bot{bottom:0;border-top:1px solid;padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.top span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700;padding:0 8px}
body.hide .top{transform:translateY(-110%)}body.hide .bot{transform:translateY(110%)}
#view{position:relative;flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#view.scroll{padding:8px 0}
.pg{margin:0 auto 8px;background:var(--pg)}
#view.paged{display:flex;align-items:flex-start;justify-content:flex-start}
#view.paged canvas{margin:auto}
canvas{display:block}
body[data-t=dark] canvas{filter:invert(.9) hue-rotate(180deg)}
body[data-t=sepia] canvas{filter:sepia(.45) contrast(.95)}
#sl{flex:1;direction:ltr;accent-color:var(--ac);margin:0 8px}
#pn{min-width:84px;text-align:center;font-size:13px;color:var(--mut)}
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:75%;overflow:auto;background:var(--bar);border-top:1px solid var(--ln);z-index:9;padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}
.sheet h3{margin:4px 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.seg button{padding:7px 12px;font-size:14px}.seg .on{background:var(--ac);color:#fff}
body[data-t=dark] .seg .on{color:#04201c}
#toc button{display:block;width:100%;text-align:start;border-bottom:1px solid var(--ln)}
#msg{position:fixed;inset-inline:16px;bottom:24px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:20;text-align:center}
#shade{position:absolute;inset:0;z-index:8}
.pg{position:relative}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:#2563eb55}
.hl{position:absolute;inset:0;pointer-events:none;z-index:1}
.hl i{position:absolute;opacity:.4;mix-blend-mode:multiply;border-radius:2px}
body[data-t=dark] .hl i{mix-blend-mode:screen;opacity:.5}
#areax{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:12;background:var(--ac);color:#fff;border-radius:20px;padding:8px 18px;font-weight:700}
body[data-t=dark] #areax{color:#04201c}
.ar{position:absolute;border:2px dashed var(--ac);background:#2dd4bf33;z-index:3;pointer-events:none}
#stb{position:fixed;left:50%;transform:translateX(-50%);z-index:7;display:flex;gap:8px;align-items:center;background:var(--bar);border:1px solid var(--ln);border-radius:24px;padding:6px 12px}
#stb .c{width:30px;height:30px;border-radius:50%;padding:0;border:1px solid #0003}
.top button{padding:10px 7px;font-size:14px}
.top .on{color:var(--ac);font-weight:700}
textarea,#edt,#nvq{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;margin-bottom:8px}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:14px;padding:3px 10px;margin:2px;font-size:13px}
.ni{padding:10px 0;border-bottom:1px solid var(--ln);display:flex;gap:10px}
.ni>i{width:5px;border-radius:3px;flex:none}.ni>div{flex:1}
.ni small{color:var(--mut)}
#nv{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:30;padding-top:env(safe-area-inset-top)}
#nv header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ln)}
#nv h1{margin:0;font-size:20px}
#nvq{width:auto;margin:10px 16px 0}
#nvt{display:flex;overflow-x:auto;padding:8px 14px;flex:none}
#nvt .chip,.gi .chip{flex:none;white-space:nowrap}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
body[data-t=dark] .chip.on{color:#04201c}
#nvl{flex:1;overflow:auto}
.gi{padding:12px 16px;border-bottom:1px solid var(--ln)}
.gi small{color:var(--mut);display:block;margin-bottom:4px}
.gi img{max-width:100%;border:1px solid var(--ln);border-radius:4px;background:#fff}
.gi .n{color:var(--ac);margin-top:4px}
#lib header button{padding:8px 10px}
</style>
</head>
<body data-t="light">
<div id="lib">
  <header><h1>مكتبتي <small style="font-size:11px;color:var(--mut)">v6</small></h1><div><button id="nvo">ملاحظاتي</button><button class="add" id="add">إضافة كتب</button></div></header>
  <div id="grid"></div>
  <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
</div>

<div id="nv" hidden>
  <header><button id="nvb">رجوع</button><h1>ملاحظاتي</h1><button id="nvx">تصدير</button></header>
  <input id="nvq" placeholder="ابحث في الملاحظات والوسوم…">
  <div id="nvt"></div><div id="nvl"></div>
</div>

<div id="rd" hidden>
  <div class="top"><button id="back">رجوع</button><span id="ttl"></span><button id="tocb">الفهرس</button><button id="nb">الملاحظات</button><button id="areab">سحب</button><button id="setb">إعدادات</button></div>
  <div id="view"></div>
  <div class="bot"><button id="pv">السابق</button><input id="sl" type="range" min="1" value="1"><span id="pn"></span><button id="nx">التالي</button></div>
  <div id="shade" hidden></div>
  <button id="areax" hidden>إنهاء التحديد ✓</button>
  <div id="stb" hidden><button class="c" data-c="0" style="background:#ffe14d"></button><button class="c" data-c="1" style="background:#6ee7a0"></button><button class="c" data-c="2" style="background:#7cc4ff"></button><button class="c" data-c="3" style="background:#ff9db1"></button><button id="stn">ملاحظة</button></div>
  <div class="sheet" id="nls" hidden><h3>ملاحظات هذا الكتاب</h3><div id="nl"></div></div>
  <div class="sheet" id="eds" hidden><h3 id="edq"></h3>
    <img id="edi" alt="" style="max-width:100%;display:none;border:1px solid var(--ln);border-radius:4px;background:#fff;margin-bottom:8px">
    <textarea id="edtx" rows="2" placeholder="النص المستخرج (عدّله إن كان مشوّهاً)"></textarea>
    <textarea id="edn" rows="3" placeholder="اكتب ملاحظتك…"></textarea>
    <input id="edt" placeholder="الوسوم (افصل بينها بفاصلة)"><div id="edc"></div>
    <div class="row" id="edcol"></div>
    <div class="row"><button class="add" id="edsv">حفظ</button><button id="edd">حذف</button></div></div>
  <div class="sheet" id="tocs" hidden><h3>الفهرس</h3><div id="toc"></div></div>
  <div class="sheet" id="sets" hidden>
    <h3>الإعدادات</h3>
    <div class="row">المظهر<div class="seg" data-k="theme"><button data-v="light">فاتح</button><button data-v="sepia">سيبيا</button><button data-v="dark">داكن</button></div></div>
    <div class="row">طريقة القراءة<div class="seg" data-k="mode"><button data-v="scroll">تمرير</button><button data-v="paged">صفحات</button></div></div>
    <div class="row">اتجاه التقليب<div class="seg" data-k="rtl"><button data-v="true">من اليمين</button><button data-v="false">من اليسار</button></div></div>
    <div class="row">قص الهوامش<div class="seg" data-k="crop"><button data-v="true">تشغيل</button><button data-v="false">إيقاف</button></div></div>
    <div class="row">التكبير<div class="seg"><button id="zo">−</button><button id="zv" disabled></button><button id="zi">+</button></div></div>
  </div>
</div>
<div id="msg" hidden></div>

<script src="lib/pdf.min.js"></script>
<script type="module">
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdf.worker.min.js';
const $ = s => document.querySelector(s);
const S = Object.assign({theme:'light',mode:'scroll',rtl:true,crop:true,zoom:1}, JSON.parse(localStorage.rs || '{}'));
const saveS = () => localStorage.rs = JSON.stringify(S);
document.body.dataset.t = S.theme;

/* ---------- التخزين المحلي ---------- */
const dbp = new Promise((ok, no) => {
  const r = indexedDB.open('reader', 2);
  r.onupgradeneeded = () => { const d = r.result; for (const n of ['books','files','notes']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath:'id'}); };
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const tx = async (st, mode, fn) => { const db = await dbp; return new Promise((ok, no) => { const t = db.transaction(st, mode); const q = fn(t.objectStore(st)); t.oncomplete = () => ok(q.result); t.onerror = () => no(t.error); }); };
const dbGetAll = () => tx('books','readonly', s => s.getAll());
const dbGet = (st, id) => tx(st,'readonly', s => s.get(id));
const dbPut = (st, v) => tx(st,'readwrite', s => s.put(v));
const dbDel = id => Promise.all([tx('books','readwrite', s => s.delete(id)), tx('files','readwrite', s => s.delete(id))]);

const msg = t => { const m = $('#msg'); m.textContent = t; m.hidden = !t; };
const pdfOpts = data => ({data, cMapUrl:'./lib/cmaps/', cMapPacked:true, standardFontDataUrl:'./lib/standard_fonts/', disableFontFace:true, useSystemFonts:false});

/* ---------- المكتبة ---------- */
async function renderLib() {
  const books = (await dbGetAll()).sort((a, b) => b.last - a.last);
  const g = $('#grid'); g.innerHTML = '';
  if (!books.length) { g.innerHTML = '<div class="empty">لا توجد كتب بعد.<br>اضغط «إضافة كتب» واختر ملفات PDF من جهازك.</div>'; return; }
  for (const b of books) {
    const d = document.createElement('div');
    const pct = Math.round((b.page - 1) / Math.max(1, b.pages - 1) * 100);
    d.className = 'bk';
    d.innerHTML = `<button class="bk" style="width:100%"><img src="${b.cover || ''}" alt=""><b></b><div class="bar"><i style="width:${pct}%"></i></div><small>${pct}% · ${b.pages} صفحة</small></button><button class="x" title="حذف">×</button>`;
    d.querySelector('b').textContent = b.name;
    d.querySelector('.bk').onclick = () => openBook(b.id);
    d.querySelector('.x').onclick = async () => { if (confirm('حذف «' + b.name + '» من التطبيق؟ (ملاحظاته تبقى محفوظة)')) { await dbDel(b.id); renderLib(); } };
    g.appendChild(d);
  }
}
$('#add').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  navigator.storage?.persist?.();
  const old = await dbGetAll();
  for (let i = 0; i < files.length; i++) {
    const f = files[i]; msg(`جارٍ استيراد ${i + 1} من ${files.length}…`);
    if (old.some(o => o.size === f.size && o.name === f.name.replace(/\.pdf$/i, ''))) continue;
    try {
      const doc = await pdfjsLib.getDocument(pdfOpts(await f.arrayBuffer())).promise;
      const p = await doc.getPage(1), v0 = p.getViewport({scale:1}), sc = 260 / v0.width;
      const c = document.createElement('canvas'), v = p.getViewport({scale:sc});
      c.width = v.width; c.height = v.height;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      await p.render({canvasContext:x, viewport:v}).promise;
      const id = crypto.randomUUID();
      await dbPut('files', {id, blob:f});
      await dbPut('books', {id, name:f.name.replace(/\.pdf$/i, ''), size:f.size, pages:doc.numPages, page:1, cover:c.toDataURL('image/jpeg', .7), added:Date.now(), last:Date.now()});
      doc.destroy();
    } catch (err) { alert('تعذّر فتح الملف: ' + f.name); }
  }
  msg(''); renderLib();
};

/* ---------- القارئ ---------- */
let NOTES = [], pdf, book, cur = 1, crop = {l:0,t:0,r:1,b:1}, io, pgs = [], est = 0, saveT;
const view = $('#view');

async function calcCrop() {
  let l = 1, t = 1, r = 0, b = 0; const n = pdf.numPages;
  const pick = [...new Set([Math.min(2, n), Math.ceil(n / 3), Math.ceil(n / 2), Math.ceil(n * 2 / 3)])];
  for (const i of pick) {
    const p = await pdf.getPage(i), v = p.getViewport({scale:.4});
    const c = document.createElement('canvas'); c.width = v.width; c.height = v.height;
    const x = c.getContext('2d', {willReadFrequently:true}); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    await p.render({canvasContext:x, viewport:v}).promise;
    const d = x.getImageData(0, 0, c.width, c.height).data;
    for (let y = 0; y < c.height; y++) for (let xx = 0; xx < c.width; xx++) {
      const k = (y * c.width + xx) * 4;
      if (d[k] + d[k+1] + d[k+2] < 690) { l = Math.min(l, xx / c.width); r = Math.max(r, (xx + 1) / c.width); t = Math.min(t, y / c.height); b = Math.max(b, (y + 1) / c.height); }
    }
  }
  const pd = .02;
  if (r - l < .3 || b - t < .3) return {l:0,t:0,r:1,b:1};
  return {l:Math.max(0, l - pd), t:Math.max(0, t - pd), r:Math.min(1, r + pd), b:Math.min(1, b + pd)};
}

const FULL = {l:0,t:0,r:1,b:1};
async function draw(n, wrap) {
  const p = await pdf.getPage(n), v0 = p.getViewport({scale:1});
  const c = S.crop ? crop : FULL;
  const cw = (c.r - c.l) * v0.width, ch = (c.b - c.t) * v0.height;
  const css = (view.clientWidth - 8) * S.zoom, sc = css / cw, dpr = Math.min(devicePixelRatio || 1, 2.5);
  let canvas = wrap.querySelector('canvas');
  if (!canvas) { canvas = document.createElement('canvas'); wrap.prepend(canvas); }
  canvas._t?.cancel();
  wrap.querySelectorAll('.hl,.textLayer').forEach(e => e.remove());
  canvas.width = Math.round(cw * sc * dpr); canvas.height = Math.round(ch * sc * dpr);
  canvas.style.width = css + 'px'; canvas.style.height = (ch * sc) + 'px';
  wrap.style.width = css + 'px'; wrap.style.height = (ch * sc) + 'px';
  wrap._n = n; wrap._c = c;
  const task = canvas._t = p.render({canvasContext:canvas.getContext('2d'), viewport:p.getViewport({scale:sc * dpr}),
    transform:[1,0,0,1,-c.l * v0.width * sc * dpr, -c.t * v0.height * sc * dpr]});
  try { await task.promise; } catch (e) { if (e?.name !== 'RenderingCancelledException') throw e; return; }
  if (canvas._t !== task) return;
  const hl = document.createElement('div'); hl.className = 'hl'; wrap.appendChild(hl); paintHl(wrap);
  const tl = document.createElement('div'); tl.className = 'textLayer'; tl.style.setProperty('--scale-factor', sc); wrap.appendChild(tl);
  const v = p.getViewport({scale:sc, offsetX:-c.l * v0.width * sc, offsetY:-c.t * v0.height * sc});
  pdfjsLib.renderTextLayer({textContentSource:await p.getTextContent(), container:tl, viewport:v, textDivs:[]});
}

async function build() {
  io?.disconnect(); view.innerHTML = ''; view.scrollTop = 0;
  view.className = S.mode;
  const p1 = await pdf.getPage(1), v0 = p1.getViewport({scale:1});
  const c = S.crop ? crop : {l:0,t:0,r:1,b:1};
  const css = (view.clientWidth - 8) * S.zoom;
  est = css * ((c.b - c.t) * v0.height) / ((c.r - c.l) * v0.width);
  if (S.mode === 'scroll') {
    pgs = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const d = document.createElement('div'); d.className = 'pg'; d.dataset.n = i; d.style.height = est + 'px'; d.style.width = css + 'px';
      view.appendChild(d); pgs.push(d);
    }
    io = new IntersectionObserver(es => es.forEach(e => {
      const d = e.target;
      if (e.isIntersecting) { if (!d.firstChild) draw(+d.dataset.n, d); }
      else if (d.firstChild) { d.firstChild._t?.cancel(); d.innerHTML = ''; }
    }), {root:view, rootMargin:'1500px 0px'});
    pgs.forEach(d => io.observe(d));
    view.scrollTop = pgs[cur - 1].offsetTop - 8;
  } else {
    const w = document.createElement('div'); w.className = 'pg'; view.appendChild(w); await draw(cur, w);
  }
  ui();
}

function ui() {
  $('#sl').max = pdf.numPages; $('#sl').value = cur;
  $('#pn').textContent = cur + ' / ' + pdf.numPages;
  clearTimeout(saveT);
  saveT = setTimeout(saveProgress, 600);
}
function saveProgress() { if (!book) return; book.page = cur; book.last = Date.now(); dbPut('books', book); }

view.addEventListener('scroll', () => {
  if (S.mode !== 'scroll' || !pgs.length) return;
  const mid = view.scrollTop + view.clientHeight / 3; let lo = 0, hi = pgs.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (pgs[m].offsetTop <= mid) lo = m; else hi = m - 1; }
  if (lo + 1 !== cur) { cur = lo + 1; ui(); }
}, {passive:true});

async function go(n) {
  n = Math.max(1, Math.min(pdf.numPages, n));
  if (S.mode === 'scroll') { view.scrollTop = pgs[n - 1].offsetTop - 8; cur = n; ui(); }
  else { cur = n; await draw(n, view.firstChild); view.scrollTop = 0; ui(); }
}
const next = () => go(cur + 1), prev = () => go(cur - 1);
$('#nx').onclick = next; $('#pv').onclick = prev;
$('#sl').oninput = e => $('#pn').textContent = e.target.value + ' / ' + pdf.numPages;
$('#sl').onchange = e => go(+e.target.value);

/* لمس: وسط الشاشة يُظهر/يُخفي الأزرار، وفي وضع الصفحات الأطراف تقلّب */
let tx0, ty0;
view.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, {passive:true});
view.addEventListener('touchend', e => {
  if (S.mode !== 'paged') return;
  const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && view.scrollWidth <= view.clientWidth + 4) (dx > 0) === S.rtl ? next() : prev();
});
view.addEventListener('click', e => {
  if (area) return;
  if (!getSelection().isCollapsed) return;
  const wrap = e.target.closest?.('.pg');
  if (wrap?._c) {
    const wb = wrap.getBoundingClientRect(), c = wrap._c;
    const fx = c.l + (e.clientX - wb.left) / wb.width * (c.r - c.l), fy = c.t + (e.clientY - wb.top) / wb.height * (c.b - c.t);
    const h = NOTES.find(h => h.page === wrap._n && h.rects.some(r => fx >= r.x && fx <= r.x + r.w && fy >= r.y && fy <= r.y + r.h));
    if (h) { openEditor(h); return; }
  }
  const x = e.clientX / innerWidth;
  if (S.mode === 'paged' && (x < .25 || x > .75)) { (x < .25) === S.rtl ? prev() : next(); return; }
  document.body.classList.toggle('hide');
});

async function openBook(id, pg, fromNv) {
  msg('جارٍ فتح الكتاب…');
  book = await dbGet('books', id); const f = await dbGet('files', id);
  if (!book || !f) { msg(''); alert('هذا الكتاب غير موجود في التطبيق (ربما حُذف).'); return; }
  pdf = await pdfjsLib.getDocument(pdfOpts(await f.blob.arrayBuffer())).promise;
  if (S.crop && !book.crop) { book.crop = await calcCrop(); }
  crop = book.crop || crop; cur = pg || book.page || 1; NOTES = (await tx('notes','readonly', s => s.getAll())).filter(n => n.book === id);
  $('#ttl').textContent = book.name; $('#lib').hidden = true; $('#rd').hidden = false;
  document.body.classList.remove('hide'); closeSheets(); history[fromNv ? 'replaceState' : 'pushState']({r:1}, '');
  await build(); msg('');
  setTimeout(() => document.body.classList.add('hide'), 1800);
}
function closeReader() {
  saveProgress(); io?.disconnect(); pdf?.destroy(); pdf = book = null; pgs = []; NOTES = []; view.innerHTML = '';
  $('#rd').hidden = true; $('#lib').hidden = false; renderLib();
}
$('#back').onclick = () => history.back();

/* ---------- التظليل والملاحظات ---------- */
const COL = ['#ffe14d','#6ee7a0','#7cc4ff','#ff9db1'];
const repaint = () => view.querySelectorAll('.pg').forEach(paintHl);
function paintHl(wrap) {
  const hl = wrap.querySelector('.hl'); if (!hl) return; hl.innerHTML = ''; const c = wrap._c;
  for (const h of NOTES) if (h.page === wrap._n) for (const r of h.rects) {
    const d = document.createElement('i');
    d.style.cssText = `left:${(r.x - c.l) / (c.r - c.l) * 100}%;top:${(r.y - c.t) / (c.b - c.t) * 100}%;width:${r.w / (c.r - c.l) * 100}%;height:${r.h / (c.b - c.t) * 100}%;background:${COL[h.color]}`;
    hl.appendChild(d);
  }
}
function snap(page, rects) {
  const wrap = [...view.querySelectorAll('.pg')].find(w => w._n === page), cv = wrap?.querySelector('canvas');
  if (!cv || !cv.width) return '';
  const c = wrap._c, X = v => (v - c.l) / (c.r - c.l) * cv.width, Y = v => (v - c.t) / (c.b - c.t) * cv.height;
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  for (const r of rects) { x0 = Math.min(x0, X(r.x)); y0 = Math.min(y0, Y(r.y)); x1 = Math.max(x1, X(r.x + r.w)); y1 = Math.max(y1, Y(r.y + r.h)); }
  x0 = Math.max(0, x0 - 6); y0 = Math.max(0, y0 - 6); x1 = Math.min(cv.width, x1 + 6); y1 = Math.min(cv.height, y1 + 6);
  const w = x1 - x0, h = y1 - y0; if (w < 8 || h < 8) return '';
  const k = Math.min(1, 700 / w), o = document.createElement('canvas'); o.width = Math.round(w * k); o.height = Math.round(h * k);
  o.getContext('2d').drawImage(cv, x0, y0, w, h, 0, 0, o.width, o.height);
  return o.toDataURL('image/jpeg', .72);
}
async function addHl(page, rects, text, color) {
  const h = {id:crypto.randomUUID(), book:book.id, bookName:book.name, page, rects, text, img:snap(page, rects), color, note:'', tags:[], ts:Date.now()};
  NOTES.push(h); await dbPut('notes', h); repaint(); return h;
}
function curSel() {
  const s = getSelection(); if (!s || s.isCollapsed || !s.rangeCount) return null;
  const r = s.getRangeAt(0), wrap = (r.startContainer.parentElement || r.startContainer).closest?.('.pg');
  if (!wrap?._c || !view.contains(wrap)) return null;
  const wb = wrap.getBoundingClientRect(), c = wrap._c, rects = [], seen = new Set();
  for (const q of r.getClientRects()) {
    if (q.width < 2 || q.height < 2 || q.height > wb.height * .2) continue;
    const k = [q.left, q.top, q.width, q.height].map(v => Math.round(v / 2)).join();
    if (seen.has(k)) continue; seen.add(k);
    rects.push({x:c.l + (q.left - wb.left) / wb.width * (c.r - c.l), y:c.t + (q.top - wb.top) / wb.height * (c.b - c.t), w:q.width / wb.width * (c.r - c.l), h:q.height / wb.height * (c.b - c.t)});
  }
  const text = s.toString().replace(/\s+/g, ' ').trim();
  return rects.length && text ? {page:wrap._n, rects, text, top:r.getBoundingClientRect().top} : null;
}
const stb = $('#stb'); let lastQ = null, selT, hideT;
document.addEventListener('selectionchange', () => {
  clearTimeout(selT);
  selT = setTimeout(() => {
    const q = curSel();
    if (q) { clearTimeout(hideT); lastQ = q; stb.hidden = false; stb.style.top = Math.max(80, q.top - 54) + 'px'; }
    else { clearTimeout(hideT); hideT = setTimeout(() => { stb.hidden = true; lastQ = null; }, 600); }
  }, 200);
});
async function makeHl(color, note) {
  const q = lastQ; if (!q) return;
  const h = await addHl(q.page, q.rects, q.text, color);
  getSelection().removeAllRanges(); stb.hidden = true; lastQ = null;
  if (note) openEditor(h);
}
stb.querySelectorAll('.c').forEach(b => b.onclick = () => makeHl(+b.dataset.c, false));
$('#stn').onclick = () => makeHl(0, true);

/* التحديد بالسحب: اضغط مطولاً ثم اسحب فوق النص أو أي مساحة. التمرير العادي يبقى يعمل */
async function pageItems(n) {
  if (pdf._it?.[n]) return pdf._it[n];
  const p = await pdf.getPage(n), v = p.getViewport({scale:1}), tc = await p.getTextContent(), out = [];
  for (const it of tc.items) {
    if (!it.str || !it.str.trim()) continue;
    const t = pdfjsLib.Util.transform(v.transform, it.transform), fh = Math.hypot(t[2], t[3]) || it.height * v.scale;
    out.push({s:it.str, rtl:it.dir === 'rtl' || /[\u0590-\u08ff]/.test(it.str), x:t[4] / v.width, y:(t[5] - fh * .95) / v.height, w:it.width * v.scale / v.width, h:fh * 1.2 / v.height});
  }
  (pdf._it ??= {})[n] = out; return out;
}
async function pickText(page, R) {
  const items = await pageItems(page), rects = [], parts = [];
  for (const it of items) {
    const cy = it.y + it.h / 2; if (cy < R.y || cy > R.y + R.h) continue;
    const n = it.s.length || 1, sel = [];
    for (const m of it.s.matchAll(/\S+/g)) {
      const a = m.index / n, b = (m.index + m[0].length) / n;
      const x0 = it.rtl ? it.x + it.w * (1 - b) : it.x + it.w * a, x1 = it.rtl ? it.x + it.w * (1 - a) : it.x + it.w * b;
      const mx = (x0 + x1) / 2; if (mx >= R.x && mx <= R.x + R.w) sel.push({m:m[0], x0, x1});
    }
    if (!sel.length) continue;
    const x0 = Math.min(...sel.map(q => q.x0)), x1 = Math.max(...sel.map(q => q.x1));
    rects.push({x:x0, y:it.y, w:x1 - x0, h:it.h}); parts.push({y:it.y, x:x0, rtl:it.rtl, t:sel.map(q => q.m).join(' ')});
  }
  parts.sort((a, b) => Math.abs(a.y - b.y) > .008 ? a.y - b.y : (a.rtl ? b.x - a.x : a.x - b.x));
  return rects.length ? {rects, text:parts.map(p => p.t).join(' ')} : {rects:[R], text:''};
}
let area = false, ad = null, aw = null, ax = 0, ay = 0, aT = null, aPend = false;
const setArea = on => {
  area = on; view.style.userSelect = on ? 'none' : ''; $('#areab').classList.toggle('on', on); $('#areax').hidden = !on;
  if (on) { msg('اضغط مطولاً ثم اسحب فوق النص لتظليله'); setTimeout(() => msg(''), 2800); }
};
$('#areab').onclick = () => setArea(!area);
$('#areax').onclick = () => setArea(false);
view.addEventListener('contextmenu', e => { if (area) e.preventDefault(); });
view.addEventListener('touchmove', e => { if (ad) e.preventDefault(); }, {passive:false});
view.addEventListener('pointerdown', e => {
  if (!area) return; const w = e.target.closest('.pg'); if (!w?._c) return;
  ax = e.clientX; ay = e.clientY; aPend = true; clearTimeout(aT);
  aT = setTimeout(() => { if (!aPend) return; aw = w; ad = document.createElement('div'); ad.className = 'ar'; aw.appendChild(ad); navigator.vibrate?.(20); }, 300);
});
view.addEventListener('pointermove', e => {
  if (aPend && !ad && Math.hypot(e.clientX - ax, e.clientY - ay) > 10) { aPend = false; clearTimeout(aT); return; }
  if (!ad) return; const wb = aw.getBoundingClientRect();
  Object.assign(ad.style, {left:Math.min(ax, e.clientX) - wb.left + 'px', top:Math.min(ay, e.clientY) - wb.top + 'px', width:Math.abs(e.clientX - ax) + 'px', height:Math.abs(e.clientY - ay) + 'px'});
});
view.addEventListener('pointercancel', () => { aPend = false; clearTimeout(aT); if (ad) { ad.remove(); ad = null; } });
view.addEventListener('pointerup', async e => {
  aPend = false; clearTimeout(aT); if (!ad) return;
  const wb = aw.getBoundingClientRect(), c = aw._c, page = aw._n; ad.remove(); ad = null;
  const w = Math.abs(e.clientX - ax), h = Math.abs(e.clientY - ay); if (w < 12 || h < 8) return;
  const R = {x:c.l + (Math.min(ax, e.clientX) - wb.left) / wb.width * (c.r - c.l), y:c.t + (Math.min(ay, e.clientY) - wb.top) / wb.height * (c.b - c.t), w:w / wb.width * (c.r - c.l), h:h / wb.height * (c.b - c.t)};
  const q = await pickText(page, R);
  openEditor(await addHl(page, q.rects, q.text, 0));
});

/* نافذة تعديل الملاحظة */
let eh = null;
const snip = (t, n) => t ? (t.length > n ? t.slice(0, n) + '…' : t) : '[تظليل مساحة]';
function renderCols() {
  const col = $('#edcol'); col.innerHTML = '';
  COL.forEach((c, i) => { const b = document.createElement('button'); b.style.cssText = `width:32px;height:32px;border-radius:50%;padding:0;background:${c};border:3px solid ${i === eh.color ? 'var(--fg)' : 'transparent'}`; b.onclick = () => { eh.color = i; renderCols(); }; col.appendChild(b); });
}
async function openEditor(h) {
  eh = h; closeSheets(); $('#edq').textContent = 'صفحة ' + h.page;
  $('#edi').style.display = h.img ? 'block' : 'none'; if (h.img) $('#edi').src = h.img; $('#edtx').value = h.text;
  $('#edn').value = h.note; $('#edt').value = h.tags.join('، '); renderCols();
  const cnt = {}; (await tx('notes', 'readonly', s => s.getAll())).forEach(n => n.tags.forEach(t => cnt[t] = (cnt[t] || 0) + 1));
  const box = $('#edc'); box.innerHTML = '';
  Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 20).forEach(t => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = '#' + t;
    b.onclick = () => { const cur = $('#edt').value.split(/[,،]+/).map(x => x.trim()).filter(Boolean); if (!cur.includes(t)) cur.push(t); $('#edt').value = cur.join('، '); };
    box.appendChild(b);

  $('#eds').hidden = $('#shade').hidden = false;
}
$('#edsv').onclick = async () => {
  eh.note = $('#edn').value.trim(); eh.text = $('#edtx').value.trim();
  eh.tags = [...new Set($('#edt').value.split(/[,،]+/).map(x => x.trim().replace(/^#/, '')).filter(Boolean))];

};
$('#edd').onclick = async () => {
  if (!confirm('حذف هذا التظليل؟')) return;

};

/* فهرس ملاحظات الكتاب */
$('#nb').onclick = () => { closeSheets(); renderNL(); $('#nls').hidden = $('#shade').hidden = false; };
function renderNL() {
  const box = $('#nl'); box.innerHTML = '';
  if (!NOTES.length) { box.textContent = 'لا توجد ملاحظات بعد. حدّد نصاً في الكتاب (بالضغط المطوّل) لتظليله.'; return; }
  [...NOTES].sort((a, b) => a.page - b.page || a.ts - b.ts).forEach(h => {
    const it = document.createElement('div'); it.className = 'ni';
    const bar = document.createElement('i'); bar.style.background = COL[h.color];
    const t = document.createElement('div');
    const sm = document.createElement('small'); sm.textContent = 'صفحة ' + h.page + (h.tags.length ? ' · ' + h.tags.map(x => '#' + x).join(' ') : '');
    let el;
    if (h.img) { el = document.createElement('img'); el.src = h.img; el.style.cssText = 'max-width:100%;border:1px solid var(--ln);border-radius:4px;background:#fff;margin-top:4px'; }
    else { el = document.createElement('div'); el.textContent = snip(h.text, 120); }
    t.append(sm, el);
    if (h.note) { const n = document.createElement('div'); n.textContent = '✎ ' + h.note; n.style.color = 'var(--ac)'; t.append(n); }
    const ed = document.createElement('button'); ed.textContent = 'تعديل'; ed.onclick = ev => { ev.stopPropagation(); openEditor(h); };
    it.append(bar, t, ed); it.onclick = () => { closeSheets(); go(h.page); };
    box.appendChild(it);
  });
}

/* ---------- فهرس الملاحظات العام والوسوم ---------- */
let tagF = null; const nv = $('#nv');
async function renderNv() {
  const all = (await tx('notes', 'readonly', s => s.getAll())).sort((a, b) => b.ts - a.ts);
  const q = $('#nvq').value.trim(), cnt = {};
  all.forEach(n => n.tags.forEach(t => cnt[t] = (cnt[t] || 0) + 1));
  if (tagF && !cnt[tagF]) tagF = null;
  const tb = $('#nvt'); tb.innerHTML = '';
  const mk = (label, val) => { const b = document.createElement('button'); b.className = 'chip' + (tagF === val ? ' on' : ''); b.textContent = label; b.onclick = () => { tagF = val; renderNv(); }; tb.appendChild(b); };
  mk('الكل (' + all.length + ')', null);
  Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).forEach(t => mk('#' + t + ' (' + cnt[t] + ')', t));
  const list = all.filter(n => (!tagF || n.tags.includes(tagF)) && (!q || [n.text, n.note, n.bookName, n.tags.join(' ')].join(' ').includes(q)));
  nv._list = list;
  const box = $('#nvl'); box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<div class="empty" style="margin-top:12vh">لا توجد ملاحظات مطابقة.<br>حدّد نصاً داخل أي كتاب لتظليله وإضافة ملاحظة ووسم.</div>'; return; }
  list.forEach(h => {
    const it = document.createElement('div'); it.className = 'gi';
    const sm = document.createElement('small'); sm.textContent = h.bookName + ' · صفحة ' + h.page; it.appendChild(sm);
    if (h.img) { const im = document.createElement('img'); im.src = h.img; it.appendChild(im); }
    else { const d = document.createElement('div'); d.textContent = snip(h.text, 200); it.appendChild(d); }
    if (h.note) { const n = document.createElement('div'); n.className = 'n'; n.textContent = '✎ ' + h.note; it.appendChild(n); }
    if (h.tags.length) {
      const row = document.createElement('div');
      h.tags.forEach(t => { const c = document.createElement('button'); c.className = 'chip'; c.textContent = '#' + t; c.onclick = ev => { ev.stopPropagation(); tagF = t; renderNv(); }; row.appendChild(c); });
      it.appendChild(row);
    }
    it.onclick = () => { nv.hidden = true; openBook(h.book, h.page, true); };
    box.appendChild(it);
  });
}
$('#nvo').onclick = () => { history.pushState({n:1}, ''); nv.hidden = false; renderNv(); };
$('#nvb').onclick = () => history.back();
$('#nvq').oninput = renderNv;
addEventListener('popstate', () => { if (!nv.hidden) nv.hidden = true; });
function exportMd(list) {
  if (!list.length) { msg('لا توجد ملاحظات للتصدير'); setTimeout(() => msg(''), 1800); return; }
  const by = {}; list.forEach(h => (by[h.bookName] ??= []).push(h));
  let t = '# ' + (tagF ? 'ملاحظات الوسم #' + tagF : 'ملاحظاتي') + '\n\n';
  for (const [b, hs] of Object.entries(by)) {
    t += '## ' + b + '\n\n';
    hs.sort((x, y) => x.page - y.page).forEach(h => {
      t += '- (ص ' + h.page + ') ' + (h.text || '[تظليل مساحة]') + '\n';
      if (h.note) t += '  - ملاحظتي: ' + h.note + '\n';
      if (h.tags.length) t += '  - الوسوم: ' + h.tags.map(x => '#' + x).join(' ') + '\n';
    });
    t += '\n';
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], {type:'text/markdown;charset=utf-8'}));
  a.download = (tagF ? 'وسم-' + tagF : 'ملاحظاتي') + '.md'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$('#nvx').onclick = () => exportMd(nv._list || []);

/* ---------- الفهرس والإعدادات ---------- */
const closeSheets = () => { $('#tocs').hidden = $('#sets').hidden = $('#eds').hidden = $('#nls').hidden = $('#shade').hidden = true; };
$('#shade').onclick = closeSheets;
$('#tocb').onclick = async () => {
  closeSheets(); $('#tocs').hidden = $('#shade').hidden = false;
  const box = $('#toc'); box.textContent = 'جارٍ التحميل…';
  const o = await pdf.getOutline();
  if (!o) { box.textContent = 'لا يوجد فهرس داخل هذا الكتاب. استخدم شريط الصفحات بالأسفل.'; return; }
  box.innerHTML = '';
  const walk = async (items, lv) => {
    for (const it of items) {
      let pg = null;
      try { let d = it.dest; if (typeof d === 'string') d = await pdf.getDestination(d); if (d) pg = (await pdf.getPageIndex(d[0])) + 1; } catch {}
      const b = document.createElement('button'); b.textContent = it.title; b.style.paddingInlineStart = (12 + lv * 16) + 'px';
      if (pg) b.onclick = () => { closeSheets(); go(pg); }; else b.style.opacity = .5;
      box.appendChild(b);
      if (it.items?.length) await walk(it.items, lv + 1);
    }
  };
  await walk(o, 0);
};
function syncSets() {
  document.querySelectorAll('.seg[data-k]').forEach(s => s.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(S[s.dataset.k]))));
  $('#zv').textContent = Math.round(S.zoom * 100) + '%';
}
$('#setb').onclick = () => { closeSheets(); syncSets(); $('#sets').hidden = $('#shade').hidden = false; };
document.querySelectorAll('.seg[data-k] button').forEach(b => b.onclick = async () => {
  const k = b.parentNode.dataset.k; let v = b.dataset.v; if (v === 'true') v = true; if (v === 'false') v = false;
  S[k] = v; saveS(); syncSets();
  if (k === 'theme') document.body.dataset.t = v;
  if (k === 'mode' || k === 'crop') { if (k === 'crop' && v && !book.crop) { book.crop = await calcCrop(); crop = book.crop; } await build(); }
});
const zoom = d => { S.zoom = Math.max(.6, Math.min(3, +(S.zoom + d).toFixed(2))); saveS(); syncSets(); build(); };
$('#zi').onclick = () => zoom(.2); $('#zo').onclick = () => zoom(-.2);

let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => pdf && build(), 300); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
renderLib();
